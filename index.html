<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bernardo &amp; Angie — Nos casamos</title>
  <meta name="description" content="Invitación de boda de Bernardo & Angie">
  <meta name="theme-color" content="#f8f4ea">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Jost:wght@300;400;500&family=Marcellus&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="is-locked">

<!-- Hojas que caen suavemente -->
<canvas id="petals" aria-hidden="true"></canvas>

<!-- ============ PORTADA: ABRIR INVITACIÓN ============ -->
<div id="cover" class="cover" role="dialog" aria-label="Invitación de boda">
  <img class="leaf leaf--tl" src="img/hojas/rama-1.png" alt="">
  <img class="leaf leaf--br" src="img/hojas/rama-1.png" alt="">
  <div class="cover__inner">
    <p class="cover__names script">
      <span data-bind="groom"></span>
      <span class="amp">&amp;</span>
      <span data-bind="bride"></span>
    </p>
    <div class="hr-heart" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#heart"/></svg></div>
    <button id="openBtn" class="btn" type="button">
      <span data-bind="openButton"></span>
      <svg class="btn__hand" viewBox="0 0 24 24" aria-hidden="true"><use href="#hand"/></svg>
    </button>
  </div>
</div>

<!-- Botón de música -->
<button id="musicBtn" class="music-btn" type="button" hidden aria-pressed="false">
  <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#i-music"/></svg>
  <span class="music-btn__slash"></span>
</button>

<div class="page" id="top">

  <!-- ============ 1. FOTO (IMG_001) CON DALE PLAY ============ -->
  <section class="photo photo--play" id="inicio-foto" data-photo="cover">
    <figure class="photo__fig">
      <img alt="">
      <div class="photo__shade" aria-hidden="true"></div>
      <svg class="torn torn--b" viewBox="0 0 1000 60" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="play">
        <svg class="play__arc" viewBox="0 0 300 90" aria-hidden="true">
          <defs><path id="playArc" d="M40 82 A140 140 0 0 1 260 82"/></defs>
          <text><textPath href="#playArc" startOffset="50%" text-anchor="middle" id="playCurve"></textPath></text>
        </svg>
        <button id="playBtn" class="play__btn" type="button">
          <span class="play__ring" aria-hidden="true"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.4v13.2L18.8 12z"/></svg>
        </button>
      </div>
    </figure>
  </section>

  <!-- ============ 2. VERSÍCULO ============ -->
  <section class="sec verse" id="versiculo">
    <img class="leaf leaf--tl leaf--sway" src="img/hojas/rama-1.png" alt="">
    <div class="sec__in">
      <p class="verse__ref reveal" data-bind="verseRef"></p>
      <p class="verse__text reveal" data-lines="verse"></p>
    </div>
  </section>

  <!-- ============ 3. NOMBRES, FECHA Y FRASE ============ -->
  <section class="sec hero" id="hero">
    <img class="leaf leaf--bl leaf--sway" src="img/hojas/rama-3.png" alt="">
    <img class="leaf leaf--tr leaf--sway" src="img/hojas/rama-4.png" alt="">
    <div class="sec__in">
      <h1 class="hero__names script reveal reveal--zoom" aria-label="Bernardo y Angie">
        <span data-bind="groom"></span>
        <span class="amp">&amp;</span>
        <span data-bind="bride"></span>
      </h1>
      <p class="hero__tagline reveal" data-bind="tagline"></p>
      <div class="hr-heart reveal" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#heart"/></svg></div>

      <div class="date reveal" aria-label="Fecha de la boda">
        <p class="date__month" data-bind="month"></p>
        <div class="date__row">
          <span data-bind="weekday"></span>
          <i aria-hidden="true"></i>
          <strong class="date__day" data-bind="day"></strong>
          <i aria-hidden="true"></i>
          <span data-bind="year"></span>
        </div>
      </div>

      <p class="phrase reveal" data-lines="phrase"></p>
    </div>
  </section>

  <!-- ============ 4. CUENTA REGRESIVA ============ -->
  <section class="sec countdown-sec" id="countdown">
    <div class="sec__in">
      <h2 class="heading reveal" data-bind="countdownTitle"></h2>
      <div class="countdown reveal" role="timer" aria-live="off">
        <div class="cd"><span class="cd__num" id="cd-days">00</span><span class="cd__lbl" data-bind="lblDays"></span></div>
        <div class="cd"><span class="cd__num" id="cd-hours">00</span><span class="cd__lbl" data-bind="lblHours"></span></div>
        <div class="cd"><span class="cd__num" id="cd-minutes">00</span><span class="cd__lbl" data-bind="lblMinutes"></span></div>
        <div class="cd"><span class="cd__num" id="cd-seconds">00</span><span class="cd__lbl" data-bind="lblSeconds"></span></div>
      </div>
      <p class="countdown__done" id="countdown-done" hidden data-bind="countdownDone"></p>
    </div>
  </section>

  <!-- ============ 5. PADRES Y PADRINOS ============ -->
  <section class="sec families-sec" id="familias">
    <img class="leaf leaf--r leaf--sway" src="img/hojas/rama-6.png" alt="">
    <div class="sec__in">
      <p class="intro reveal" data-bind="parentsTitle"></p>
      <div class="families">
        <div class="family reveal reveal--left">
          <h3 data-bind="groomParentsTitle"></h3>
          <ul id="groomParents"></ul>
        </div>
        <div class="family reveal reveal--right">
          <h3 data-bind="brideParentsTitle"></h3>
          <ul id="brideParents"></ul>
        </div>
      </div>
      <div class="hr-heart reveal" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#heart"/></svg></div>
      <div class="family family--god reveal">
        <h3 data-bind="godparentsTitle"></h3>
        <ul id="godparents"></ul>
      </div>
    </div>
  </section>

  <!-- ============ 6. FOTO (IMG_002) ============ -->
  <section class="photo" data-photo="afterGodparents">
    <figure class="photo__fig reveal reveal--fade">
      <img alt="">
      <svg class="torn torn--t" viewBox="0 0 1000 60" preserveAspectRatio="none" aria-hidden="true"></svg>
      <svg class="torn torn--b" viewBox="0 0 1000 60" preserveAspectRatio="none" aria-hidden="true"></svg>
    </figure>
  </section>

  <!-- ============ 7. CEREMONIA Y RECEPCIÓN ============ -->
  <section class="sec details" id="detalles">
    <img class="leaf leaf--l leaf--sway" src="img/hojas/rama-5.png" alt="">
    <div class="sec__in">

      <article class="event" id="ceremonia">
        <svg class="event__icon reveal" viewBox="0 0 120 120" aria-hidden="true">
          <g class="line-art">
            <path d="M18 104H102"/>
            <path d="M26 104V74L50 60"/>
            <path d="M94 104V74L70 60"/>
            <path d="M48 104V54L60 34L72 54V104"/>
            <path d="M60 10V28M53.5 17H66.5"/>
            <path d="M54 104V88a6 6 0 0 1 12 0V104"/>
            <circle cx="60" cy="50" r="4.5"/>
            <path d="M33 90V84a3 3 0 0 1 6 0V90M81 90V84a3 3 0 0 1 6 0V90"/>
          </g>
        </svg>
        <h2 class="event__title reveal" data-bind="ceremonyTitle"></h2>
        <p class="event__time reveal" data-bind="ceremonyTime"></p>
        <p class="event__place reveal"><span data-bind="churchLabel"></span> <span data-bind="churchName"></span></p>
        <p class="event__city reveal" data-bind="ceremonyCity"></p>
        <a class="btn reveal" id="ceremonyMap" target="_blank" rel="noopener noreferrer">
          <span data-bind="mapLabel"></span>
          <svg class="btn__hand" viewBox="0 0 24 24" aria-hidden="true"><use href="#hand"/></svg>
        </a>
      </article>

      <div class="hr-heart hr-heart--wide reveal" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#heart"/></svg></div>

      <article class="event" id="recepcion">
        <svg class="event__icon reveal" viewBox="0 0 120 120" aria-hidden="true">
          <g class="line-art">
            <path d="M24 108V58a36 36 0 0 1 72 0V108"/>
            <path d="M34 108V60a26 26 0 0 1 52 0V108" class="soft"/>
            <g class="bloom">
              <circle cx="24" cy="58" r="5"/><circle cx="29" cy="38" r="4.5"/><circle cx="44" cy="25" r="5"/>
              <circle cx="60" cy="20" r="6"/><circle cx="76" cy="25" r="5"/><circle cx="91" cy="38" r="4.5"/><circle cx="96" cy="58" r="5"/>
            </g>
            <path d="M36 28c-5-3-8-1-9 3M52 18c-3-5-7-5-10-2M68 18c3-5 7-5 10-2M84 28c5-3 8-1 9 3"/>
            <path d="M14 108H106"/>
          </g>
        </svg>
        <h2 class="event__title reveal" data-bind="receptionTitle"></h2>
        <p class="event__place event__place--big reveal" data-bind="placeName"></p>
        <a class="btn reveal" id="receptionMap" target="_blank" rel="noopener noreferrer">
          <span data-bind="mapLabel"></span>
          <svg class="btn__hand" viewBox="0 0 24 24" aria-hidden="true"><use href="#hand"/></svg>
        </a>
      </article>

    </div>
  </section>

  <!-- ============ 8. FOTO (IMG_003) ============ -->
  <section class="photo" data-photo="afterReception">
    <figure class="photo__fig reveal reveal--fade">
      <img alt="">
      <svg class="torn torn--t" viewBox="0 0 1000 60" preserveAspectRatio="none" aria-hidden="true"></svg>
      <svg class="torn torn--b" viewBox="0 0 1000 60" preserveAspectRatio="none" aria-hidden="true"></svg>
    </figure>
  </section>

  <!-- ============ 9. PROGRAMA (sin horarios) ============ -->
  <section class="band" id="programa">
    <svg class="torn torn--t" viewBox="0 0 1000 60" preserveAspectRatio="none" aria-hidden="true"></svg>
    <svg class="torn torn--b" viewBox="0 0 1000 60" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="sec__in">
      <h2 class="heading reveal" data-bind="programTitle"></h2>
      <div class="timeline" id="timeline" role="list">
        <div class="timeline__rail" aria-hidden="true"><span class="timeline__fill" id="timelineFill"></span></div>
      </div>
    </div>
  </section>

  <!-- ============ 10. CÓDIGO DE VESTIMENTA ============ -->
  <section class="sec dress" id="vestimenta">
    <img class="leaf leaf--br leaf--sway" src="img/hojas/rama-1.png" alt="">
    <div class="sec__in">
      <svg class="dress__art reveal" viewBox="0 0 240 170" aria-hidden="true">
        <g class="line-art">
          <path d="M60 36L62 14M80 36L78 14"/>
          <path d="M56 36Q70 50 84 36"/>
          <path d="M56 36L61 72M84 36L79 72"/>
          <path d="M61 72H79M60.5 66H79.5" class="soft"/>
          <path d="M61 72C55 102 40 132 28 156M79 72C85 102 100 132 112 156"/>
          <path d="M28 156Q70 168 112 156"/>
          <path d="M70 72V162M66 73C62 102 54 134 49 162M74 73C78 102 86 134 91 162" class="soft"/>
          <path d="M65 50l5 5 5-5" class="soft"/>
          <path d="M158 28L138 36L132 102H208L202 36L182 28"/>
          <path d="M138 36L126 98L132 102M202 36L214 98L208 102"/>
          <path d="M158 28L170 64L182 28"/>
          <path d="M160 26L170 36L180 26"/>
          <path d="M170 38L166 46L170 70L174 46Z" class="tie"/>
          <path d="M162 44L154 58M178 44L186 58" class="soft"/>
          <circle cx="170" cy="84" r="1.6"/>
          <path d="M190 62h8" class="soft"/>
          <path d="M138 102L142 160H166L170 116L174 160H198L202 102"/>
        </g>
      </svg>
      <h2 class="heading reveal" data-bind="dressTitle"></h2>
      <p class="dress__style script reveal" data-bind="dressStyle"></p>
      <div class="dress__codes reveal">
        <p><span class="dress__lbl" data-bind="dressHerLabel"></span><span data-bind="dressHer"></span></p>
        <i aria-hidden="true"></i>
        <p><span class="dress__lbl" data-bind="dressHisLabel"></span><span data-bind="dressHis"></span></p>
      </div>
      <p class="dress__note reveal"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#heart"/></svg><span data-bind="dressNote"></span></p>
    </div>
  </section>

  <!-- ============ 11. LLUVIA DE SOBRES ============ -->
  <section class="sec envelope-sec" id="sobres">
    <div class="sec__in">
      <svg class="envelope" viewBox="0 0 220 150" aria-hidden="true">
        <g class="line-art line-art--thin">
          <rect x="30" y="40" width="160" height="96" rx="4" fill="#fffdf7"/>
          <path d="M30 44L110 100L190 44"/>
          <path d="M30 136L84 84M190 136L136 84"/>
        </g>
        <g class="seal">
          <path d="M110 84c-12-9-20-14-20-23 0-6 4-10 9-10 4 0 9 3 11 7 2-4 7-7 11-7 5 0 9 4 9 10 0 9-8 14-20 23z" fill="#6a7050"/>
        </g>
        <g class="falling">
          <g class="f f1"><rect x="0" y="0" width="22" height="14" rx="1.5"/><path d="M0 1L11 8L22 1"/></g>
          <g class="f f2"><rect x="0" y="0" width="22" height="14" rx="1.5"/><path d="M0 1L11 8L22 1"/></g>
          <g class="f f3"><rect x="0" y="0" width="22" height="14" rx="1.5"/><path d="M0 1L11 8L22 1"/></g>
        </g>
      </svg>
      <h2 class="envelope-title script reveal reveal--zoom" data-bind="envelopeTitle"></h2>
    </div>
  </section>

  <!-- ============ 12. CONFIRMAR ASISTENCIA ============ -->
  <section class="sec confirm-sec" id="confirmar">
    <img class="leaf leaf--l leaf--sway" src="img/hojas/rama-2.png" alt="">
    <img class="leaf leaf--r leaf--sway" src="img/hojas/rama-3.png" alt="">
    <div class="sec__in">
      <svg class="confirm__icon reveal" viewBox="0 0 24 24" aria-hidden="true"><use href="#whatsapp"/></svg>
      <h2 class="heading reveal" data-bind="confirmTitle"></h2>
      <p class="deadline reveal" id="deadline" hidden></p>
      <div class="confirm reveal" id="confirmButtons"></div>
      <svg class="sprig reveal" viewBox="-10 0 320 60" aria-hidden="true"><use href="#sprig"/></svg>
    </div>
  </section>

  <!-- ============ 13. FOTO FINAL (IMG_004) ============ -->
  <section class="photo" data-photo="afterConfirm">
    <figure class="photo__fig reveal reveal--fade">
      <img alt="">
      <svg class="torn torn--t" viewBox="0 0 1000 60" preserveAspectRatio="none" aria-hidden="true"></svg>
    </figure>
  </section>

  <!-- ============ 14. FOTO FINAL 2 (IMG_005) ============ -->
  <section class="photo photo--last" data-photo="afterConfirm2">
    <figure class="photo__fig reveal reveal--fade">
      <img alt="">
      <svg class="torn torn--t" viewBox="0 0 1000 60" preserveAspectRatio="none" aria-hidden="true"></svg>
    </figure>
  </section>

</div>

<!-- ============ SÍMBOLOS SVG REUTILIZABLES ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="heart" viewBox="0 0 24 24"><path d="M12 21C5 15.5 2.5 12 2.5 8.4 2.5 5.8 4.5 4 6.9 4c2 0 3.8 1.1 5.1 3 1.3-1.9 3.1-3 5.1-3 2.4 0 4.4 1.8 4.4 4.4C21.5 12 19 15.5 12 21z"/></symbol>

    <symbol id="hand" viewBox="0 0 24 24">
      <g fill="#fffdf7" stroke="#484d32" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round">
        <rect x="8.4" y="2.2" width="3.2" height="14" rx="1.6"/>
        <rect x="11.6" y="7" width="3" height="9" rx="1.5"/>
        <rect x="14.6" y="8" width="3" height="8.5" rx="1.5"/>
        <rect x="17.6" y="9.4" width="2.8" height="7.5" rx="1.4"/>

      </g>
    </symbol>

    <symbol id="whatsapp" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a9 9 0 0 0-7.7 13.6L3 21l4.5-1.2A9 9 0 1 0 12 3z"/>
        <path d="M9 8.3c-.3 3.6 2.9 6.8 6.5 6.7l1.1-1.5-2-1-.9.8c-1-.4-2-1.4-2.4-2.4l.8-.9-1-2z"/>
      </g>
    </symbol>

    <!-- Iconos del programa -->
    <symbol id="i-church" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 56H56M13 56V40L26 33M51 56V40L38 33M25 56V30L32 20L39 30V56M32 6V16M28 10H36M29 56V47a3 3 0 0 1 6 0V56"/>
      </g>
    </symbol>
    <symbol id="i-arch" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 58V32a20 20 0 0 1 40 0V58"/>
        <circle cx="12" cy="32" r="3"/><circle cx="15" cy="20" r="2.6"/><circle cx="23" cy="12" r="3"/><circle cx="32" cy="9" r="3.4"/><circle cx="41" cy="12" r="3"/><circle cx="49" cy="20" r="2.6"/><circle cx="52" cy="32" r="3"/>
        <path d="M6 58H58"/>
      </g>
    </symbol>
    <symbol id="i-waltz" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="22" cy="12" r="4.5"/><circle cx="42" cy="12" r="4.5"/>
        <path d="M22 18V38M22 38L17 58M22 38L28 58M22 25L34 30"/>
        <path d="M42 18L51 46H33Z M42 24L30 28"/>
        <path d="M36 46L34 58M48 46L50 58"/>
      </g>
    </symbol>
    <symbol id="i-toast" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <g transform="rotate(-14 24 34)"><path d="M16 10H32L30 30Q24 40 18 30Z"/><path d="M24 36V56M17 56H31"/></g>
        <g transform="rotate(14 40 34)"><path d="M32 10H48L46 30Q40 40 34 30Z"/><path d="M40 36V56M33 56H47"/></g>
        <path d="M32 3V7M25 5L27 8M39 5L37 8" opacity=".8"/>
      </g>
    </symbol>
    <symbol id="i-dinner" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="32" cy="32" r="13"/><circle cx="32" cy="32" r="8"/>
        <path d="M8 10V24M12 10V24M16 10V24M8 24Q12 31 16 24M12 30V56"/>
        <path d="M56 10Q48 22 56 34V56M56 10V34"/>
      </g>
    </symbol>
    <symbol id="i-music" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 46V14L46 8V40M24 22L46 16"/>
        <ellipse cx="18" cy="47" rx="7" ry="5"/><ellipse cx="40" cy="41" rx="7" ry="5"/>
      </g>
    </symbol>
